version: "v0.4"

project:
  name: "Average-Case Complexity of Multilevel Syllogistic in Lean 4"
  description: >-
    A Lean 4.33.1 development revisiting Cox, Ericson, and Mishra's 1995
    technical report TR1995-711. The Palomar surface validates six
    paper-numbered/core statements that are fully checked: finite-support
    specializations of Theorems 4.1 and 4.4, the full shell calculation of
    Example 4.1, and concrete reduction cores from Theorems 5.1–5.3.
    It deliberately does not claim a completed
    proof of the report's NP-average-completeness corollary: the present
    legacy construction requires explicit compiler, universal-reduction, and
    collapse-theory arguments, while the current partial FOS80 implementation
    is demonstrably not globally complete.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.CC, cs.LO]
  msc2020: ["68Q15", "68Q17", "03B35"]

status:
  scope: >-
    Six directly stated compared theorems validate the paper-numbered/core
    results: Theorems 4.1 and 4.4, both in the documented finite-support
    distribution setting and the latter with an explicit target-language
    `InNP` hypothesis, the full shell calculation of Example 4.1, and the
    constructive reduction cores of Theorems 5.1--5.3. In Challenge.lean the
    paper's "NP-distributional complete" is named
    `AvCom.IsNPDistributionallyComplete` and the paper's language-level
    "NP-average complete" is named `TR1995.IsNPAverageCompleteLanguage`.
    Challenge.lean gives concrete Mathlib-only
    definitions for every notion in these statements; only its six theorem
    proofs are protocol holes. The implementation library has no sorry
    statements and no project-specific axioms. Unfinished constructions are
    represented by explicit structure arguments.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "AvgCasePalomar.paper_theorem_4_1"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.paper_theorem_4_4"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.paper_example_4_1"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.paper_theorem_5_1_reduction_core"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Cantone–Omodeo–Policriti 1990"]
    - declaration: "AvgCasePalomar.paper_theorem_5_2_reduction_core"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995"]
    - declaration: "AvgCasePalomar.paper_theorem_5_3_reduction_core"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
