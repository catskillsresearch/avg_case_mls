      status: proved
    - source: "TR1995-711 Example 4.1, pp. 8–9: full length-shell calculation"
      lean: "paper_example_4_1"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "TR1995-711 Theorem 5.1, p. 15: constructive SAT-to-MLS reduction core"
      lean: "paper_theorem_5_1_reduction_core"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "TR1995-711 Theorem 5.2, pp. 16–17: constructive SAT-to-EMLS reduction core"
      lean: "paper_theorem_5_2_reduction_core"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "TR1995-711 Theorem 5.3, p. 18: constructive SAT-to-FPILP reduction core"
      lean: "paper_theorem_5_3_reduction_core"
