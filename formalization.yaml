automation:
  methods:
    - method: agent
      models: ["Cursor GPT-5.6 Sol"]
      framework: "Cursor"
      role: >-
        Lean migration, Palomar packaging, source-to-formalization auditing,
        verification, and documentation assistance under author direction.
    - method: manual
      models: []
      role: >-
        The author selected the goals, reviewed the mathematical forks and
        results, and takes responsibility for the artifact.

review:
  status: self-assessed
  reviewers: ["Lars Warren Ericson"]
  notes: "No external formal review has been performed."

known_gaps:
  - >-
    The current partial MLS decision function is not globally complete; a
    checked disjunction counterexample replaces the former placeholder.
  - >-
    Full NP-average completeness still requires constructing the explicit
    LevinNBHData/NBHToMLSData interfaces or completing the paper's SAT route.
  - >-
    The present DistTime/AvP abstraction admits AvP.zero for every
    polynomially rankable distribution; the legacy hardness chain is retained
    only as an explicit conditional interface and is not selected.
  - >-
    EMLS and FPILP average-completeness claims are not complete. The selected
    EMLS core proves semantic correctness and exact linear conjunct count but
    not size-accounted injectivity/inversion; the concrete FPILP reduction
    core is selected separately from its complexity transfer.
  - >-
    Example 4.1's full probability-shell calculation is formalized. Tests.lean
    otherwise contains repository smoke tests.

limitations:
  - >-
    Challenge.lean contains deliberate holes only in the six selected theorem
    proofs; all statement definitions are concrete. Proofs are supplied by
    AvgCaseMls/Palomar.lean.
  - >-
    The selected statements include explicit implementation forks and do not
    certify every theorem asserted in TR1995-711.

