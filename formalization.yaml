fidelity:
  divergences: >-
    The report and RS93 tie NP membership and running time to machines. The
    repository's initial finite-support untimed AvCom adaptation omits those
    computational conditions and admits zero-mass laws; the compared collapse
    diagnostics identify the consequences of that adaptation, not defects in
    the cited definitions. Timed replacements (`AvgCaseMls/Foundation`,
    `AvgCaseMls/Section4`, `AvgCaseMls/Repair`) are proved in the library but
    not on the Palomar surface. Example 4.1 carries an existentially quantified
    normalizing constant C. Theorem 5.2 uses the tagged injective `toEMLS`
    reduction; `encodeSATCNF` and `fromEMLS` are definition holes on the
    Palomar surface. Resolution lower bounds (Theorems 3.1--3.2) are fully
    formalized in `AvgCaseMls/Section3` but not compared here.

