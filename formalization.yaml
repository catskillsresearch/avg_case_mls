fidelity:
  divergences: >-
    The report uses unrestricted string distributions and full MLS decision
    and reduction machinery. The Lean development uses finite-support
    distributions, lenBot at the empty string, an explicit prefix encoding,
    and abstract composition lemmas. Both Lean and the report use non-strict
    probability comparison for rank; Lean additionally returns rank zero off
    finite support. DistTime is not linked to a decider. Separately, and
    outside the six compared statements, the project's executable MLS
    decision procedure is proved sound and complete only on a
    membership-free, eqOp-free fragment; the compared Theorem 5.1 core is
    about the membership fragment MLS-in and does not depend on that
    procedure. Example 4.1's `≤ 1` conclusion carries an existentially
    quantified positive constant, which is the report's "O(n^(1+epsilon))"
    constant: the un-normalized shell sum is (6/pi^2) * zeta(3 - 2/(1+epsilon)),
    which diverges as epsilon tends to 0 from above.
    These forks are documented in DEFINITION_FORKS.md. The selected Palomar
    claims validate those precise Lean statements, not the unfinished
    numbered average-completeness theorems.

