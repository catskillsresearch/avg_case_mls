# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Average-Case Complexity of Multilevel Syllogistic in Lean 4"
  description: >-
    A Lean 4.33.1 development revisiting Cox, Ericson, and Mishra's 1995
    technical report TR1995-711. The Palomar surface validates six report-
    related decision-fragment, encoding, and reduction-composition statements
    that are fully checked. It deliberately does not claim a completed
    proof of the report's NP-average-completeness corollary: the present
    headline construction still uses named reduction and complexity axioms,
    and global FOS80 decision completeness retains one open proof.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.CC, cs.LO]
  msc2020: ["68Q15", "68Q17", "03B35"]

status:
  scope: >-
    Six compared theorem wrappers validate report-related adapted claims.
    They cover rejection of Step 2
    contradictions, completeness of the explicitly restricted sound fragment,
    serialization round trips, polynomial encoding size, transitivity of
    distributional reductions, and transfer of NP-average completeness along a
    reduction. The wrappers depend only on
    propext, Quot.sound, and Classical.choice. The repository as a whole has
    one remaining sorry in global decision completeness and several explicitly
    documented project axioms supporting the unfinished headline hardness
    pipeline; none is in the dependency set of a compared theorem.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "AvgCasePalomar.step2_rejection"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Ferro–Omodeo–Schwartz 1980"]
    - declaration: "AvgCasePalomar.sound_fragment_completeness"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Ferro–Omodeo–Schwartz 1980"]
    - declaration: "AvgCasePalomar.formula_serialization_roundtrip"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995"]
    - declaration: "AvgCasePalomar.formula_encoding_polynomially_bounded"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995"]
    - declaration: "AvgCasePalomar.distributional_reduction_transitive"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Levin 1986", "Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.average_completeness_transfers_along_reduction"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995"]

fidelity:
  divergences: >-
    The report uses unrestricted string distributions and full MLS decision
    and reduction machinery. The Lean development uses finite-support
    distributions, lenBot at the empty string, an explicit prefix encoding,
    a restricted membership-free decision fragment, and abstract composition
    lemmas. Lean rank uses non-strict probability comparison rather than the
    report's strict comparison, and DistTime is not linked to a decider.
    These forks are documented in DEFINITION_FORKS.md. The selected Palomar
    claims validate those precise Lean statements, not the unfinished
    numbered average-completeness theorems.

sources:
  - title: "The average case complexity of multilevel syllogistic"
    authors: ["Jim Cox", "Lars Ericson", "Bud Mishra"]
    type: "report"
    id: "TR1995-711.pdf"
    location: "Courant Institute Technical Report CS-TR 711, 1995"
    relationship: formalizes
    author_endorsement: participated
  - title: "Precise average case complexity"
    authors: ["Rüdiger Reischuk", "Christian Schindelhauer"]
    type: "article"
    location: "STOC 1993"
    relationship: background
  - title: "Average case complete problems"
    authors: ["Leonid Levin"]
    type: "article"
    location: "SIAM Journal on Computing, 1986"
    relationship: background
  - title: "Decision procedures for elementary sublanguages of set theory"
    authors: ["Alfredo Ferro", "Eugenio G. Omodeo", "Jacob T. Schwartz"]
    type: "article"
    location: "Communications on Pure and Applied Mathematics, 1980"
    relationship: background
  - title: "Revisiting average case complexity of multilevel syllogistic"
    authors: ["Lars Warren Ericson"]
    type: "article"
    id: "https://arxiv.org/abs/2606.16134"
    relationship: other
    author_endorsement: participated

automation:
  methods:
    - method: agent
      models: ["Cursor GPT-5.6 Sol"]
      framework: "Cursor"
      role: >-
        Lean migration, Palomar packaging, source-to-formalization auditing,
        verification, and documentation assistance under author direction.
    - method: manual
      models: []
      role: >-
        The author selected the goals, reviewed the mathematical forks and
        results, and takes responsibility for the artifact.

review:
  status: self-assessed
  reviewers: ["Lars Warren Ericson"]
  notes: "No external formal review has been performed."

known_gaps:
  - >-
    AvgCaseMls/DecideMLS.lean retains one sorry for global FOS80 completeness.
  - >-
    The NP-average-completeness and non-AvP pipeline relies on named project
    axioms listed in DEFINITION_FORKS.md and is excluded from Comparator.
  - >-
    The present DistTime/AvP abstraction admits AvP.zero for every
    polynomially rankable distribution, conflicting with the separately
    axiomatized hardness chain; no theorem from that chain is selected.
  - >-
    EMLS and FP/LP average-completeness claims from TR1995-711 are not selected
    as completed Lean results.
  - >-
    None of the report's worked examples is currently formalized. Tests.lean
    contains repository smoke tests, not TR1995-711 examples.

limitations:
  - >-
    Challenge.lean contains deliberate holes for Comparator; selected proofs
    are supplied by AvgCaseMls/Palomar.lean.
  - >-
    The selected statements include explicit implementation forks and do not
    certify every theorem asserted in TR1995-711.

alignment:
  namespace: "AvgCasePalomar"
  statements:
    - source: "TR1995-711 §2.1, p. 5: early contradiction rejection in the model-graph procedure"
      lean: "step2_rejection"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "Adaptation of TR1995-711 §2.1, p. 5: completeness only on the Lean restricted fragment"
      lean: "sound_fragment_completeness"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "Encoding infrastructure related to TR1995-711 §5, pp. 15–18"
      lean: "formula_serialization_roundtrip"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "Adapted polynomial encoding bound related to TR1995-711 §5, pp. 15–18"
      lean: "formula_encoding_polynomially_bounded"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "Adaptation of TR1995-711 §4.2, pp. 11–12: composition of distributional reductions"
      lean: "distributional_reduction_transitive"
      module: "AvgCaseMls.Palomar"
      status: proved
    - source: "Analogue of TR1995-711 Theorem 4.4, p. 14, for the weaker Lean reduction definition"
      lean: "average_completeness_transfers_along_reduction"
      module: "AvgCaseMls.Palomar"
      status: proved
