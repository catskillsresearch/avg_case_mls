version: "v0.4"

project:
  name: "Average-Case Complexity of Multilevel Syllogistic in Lean 4"
  description: >-
    A Lean 4.33.1 revisiting of Cox, Ericson, and Mishra's 1995 technical report
    TR1995-711. The Palomar surface validates nine statements against the
    revisit-paper canon: five encoding-collapse diagnostics, Example 4.1, and
    the three SAT reduction cores (Theorems 5.1--5.3). Vacuous TR1995
    Theorems 4.1 and 4.4 in the untimed AvCom layer are omitted from the
    compared surface; timed Theorem 4.4 and the repairs live in the
    implementation library.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.CC, cs.LO]
  msc2020: ["68Q15", "68Q17", "03B35"]

status:
  scope: >-
    Nine directly compared theorems validate the revisit canon: five
    encoding-collapse diagnostics (`paper_collapse_*`), Example 4.1, and the
    three SAT reduction cores with uniform correctness/injectivity/inverse/size
    statements. Challenge.lean gives concrete Mathlib-only definitions for
    every notion; only theorem proofs and four inverse/codec boundary
    definitions (`MLSInReduction.fromMLS`, `EMLSReduction.sourceBits`,
    `EMLSReduction.toEMLS`, and `EMLSReduction.fromEMLS`) are protocol holes.
    The implementation library has no sorry statements and no project-specific
    axioms beyond propext, Quot.sound, and Classical.choice.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "AvgCasePalomar.paper_collapse_inNP_trivial"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.paper_collapse_completeness_characterization"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995", "Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.paper_collapse_theorem44_vacuous"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Cox–Ericson–Mishra 1995"]
    - declaration: "AvgCasePalomar.paper_collapse_avP_characterization"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.paper_collapse_no_theory_separates"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: ["Reischuk–Schindelhauer 1993"]
    - declaration: "AvgCasePalomar.paper_example_4_1"
      file: "AvgCaseMls/Palomar.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
