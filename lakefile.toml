name = "avg_case_mls"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AvgCaseMls", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "AvgCaseMls"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# Runnable versions of every proof displayed in arxiv.md.  Each snippet
# restates the theorem under discussion and re-proves it, importing its
# dependencies from AvgCaseMls, so a reader can compare the English and the
# Lean directly.  Checked by scripts/check_exposition.sh; kept out of
# defaultTargets so the Palomar build surface is unaffected.
[[lean_lib]]
name = "Exposition"
