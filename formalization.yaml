automation:
  methods:
    - method: agent
      models: ["Cursor GPT-5.6 Sol"]
      framework: "Cursor"
      role: >-
        Lean migration, Palomar packaging, source-to-formalization auditing,
        verification, and documentation assistance under author direction.
    - method: manual
      models: []
      role: >-
        The author selected the goals, reviewed the mathematical forks and
        results, and takes responsibility for the artifact.

review:
  status: self-assessed
  reviewers: ["Lars Warren Ericson"]
  notes: "No external formal review has been performed."

known_gaps:
  - >-
    Timed Theorem 4.4 and the `mass = 1` repair are proved in the library
    (`AvgCaseMls/Section4`, `AvgCaseMls/Repair`) but not on the Palomar surface.
  - >-
    Resolution lower bounds (Theorems 3.1--3.2) are fully formalized in
    Section 3 but not compared on the Palomar surface.
  - >-
    Full NP-average completeness still requires LevinNBHData and NBHToMLSData.
  - >-
    The partial MLS decision function is not globally complete.

limitations:
  - >-
    Challenge.lean contains deliberate holes in nine theorem proofs and four
    definition hooks; proofs are supplied by AvgCaseMls/Palomar.lean.
  - >-
    The compared statements validate the revisit-paper canon, not every
    theorem asserted in TR1995-711.

